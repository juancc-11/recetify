version: '3.9'
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: blogrecetas-app
    ports:
      - '8000:80'
    env_file:
      - .env
    volumes:
      - .:/var/www/html:delegated
      - vendor_cache:/var/www/html/vendor
      - composer_cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - YII_ENV=prod
      - YII_DEBUG=false
    command: sh -c "mkdir -p /var/www/html/web/assets /var/www/html/runtime && chown -R www-data:www-data /var/www/html/web/assets /var/www/html/runtime && apache2-foreground"
    restart: unless-stopped

volumes:
  vendor_cache:
  composer_cache:
